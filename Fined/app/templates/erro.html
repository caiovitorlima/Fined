{% extends "layout_publico.html" %}
{% from "_icones.html" import icone %}
{% block titulo %}{{ titulo }} | Fined{% endblock %}
{% block conteudo %}
<section class="erro-pagina">
  <div>
    <p class="erro-pagina__codigo">{{ codigo }}</p>
    <h1>{{ titulo }}</h1>
    <p>{{ texto }}</p>
    <a class="btn btn--tinta" href="{{ url_for('painel.inicio') if usuario else url_for('publico.inicio') }}">{{ icone('voltar') }} {{ 'Voltar ao painel' if usuario else 'Voltar ao início' }}</a>
  </div>
</section>
{% endblock %}
